name: Bug / Fehler
description: Something is wrong or broken. Deutsch ist willkommen.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom right of the app, e.g. v1.9.
    validations:
      required: true
  - type: dropdown
    id: download
    attributes:
      label: Which download
      options: [Installer, Portable exe, Zip, Page in a browser (boro-meter.html), Built from source]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt (optional)
      description: Shortened, ids and numbers only. Replace every character name before pasting. / Gekürzt, nur IDs und Zahlen, keine Charakternamen.
      render: text
  - type: checkboxes
    id: names
    attributes:
      label: Privacy
      options:
        - label: I removed every character name from what I attached.
          required: true
